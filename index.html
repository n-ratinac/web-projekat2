<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agar.io Multiplayer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; overflow: hidden; font-family: "Segoe UI", sans-serif; }
      canvas { display: block; }

      #ui {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 10;
      }

      #score {
        position: absolute; top: 18px; right: 24px;
        color: #fff; font-size: 22px; font-weight: 700;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        letter-spacing: 1px;
      }

      #leaderboard {
        position: absolute; top: 18px; left: 24px;
        color: #fff; font-size: 13px;
        background: rgba(0,0,0,0.45);
        padding: 10px 16px; border-radius: 10px;
        min-width: 160px; backdrop-filter: blur(4px);
      }
      #leaderboard h3 {
        font-size: 12px; letter-spacing: 2px;
        text-transform: uppercase; color: #aaa; margin-bottom: 6px;
      }
      #leaderboard .entry { padding: 2px 0; }
      #leaderboard .entry.me { color: #7ef7a0; font-weight: 700; }

      #ping-display {
        position: absolute; bottom: 160px; right: 18px;
        color: #555; font-size: 11px;
      }

      #minimap {
        position: absolute; bottom: 18px; right: 18px;
        width: 130px; height: 130px;
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 8px; background: rgba(0,0,0,0.4); overflow: hidden;
      }
      #minimap canvas { width: 130px; height: 130px; }

      #overlay {
        position: fixed; inset: 0;
        background: rgba(10,10,20,0.92);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 100; pointer-events: all;
      }
      #overlay h1 {
        font-size: 64px; font-weight: 900;
        color: #7ef7a0; letter-spacing: -2px;
        text-shadow: 0 0 40px rgba(126,247,160,0.5);
        margin-bottom: 8px;
      }
      #overlay p { color: #888; font-size: 15px; margin-bottom: 28px; }
      #overlay input {
        background: rgba(255,255,255,0.08);
        border: 1.5px solid rgba(255,255,255,0.2);
        color: #fff; font-size: 18px;
        padding: 10px 20px; border-radius: 8px;
        outline: none; text-align: center;
        margin-bottom: 16px; width: 240px;
      }
      #overlay input::placeholder { color: #555; }
      #overlay button {
        background: #7ef7a0; color: #111;
        font-size: 18px; font-weight: 700;
        border: none; padding: 12px 48px;
        border-radius: 8px; cursor: pointer;
        letter-spacing: 1px;
        transition: transform 0.1s, box-shadow 0.1s;
        box-shadow: 0 4px 24px rgba(126,247,160,0.3);
      }
      #overlay button:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 32px rgba(126,247,160,0.5);
      }
      #overlay .status {
        margin-top: 16px; font-size: 13px; color: #666;
      }
      #overlay .status.connecting { color: #f7c97e; }
      #overlay .status.connected  { color: #7ef7a0; }
      #overlay .status.error      { color: #f97; }

      #dead-overlay {
        position: fixed; inset: 0;
        background: rgba(10,10,20,0.88);
        display: none; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 100; pointer-events: all;
      }
      #dead-overlay h2 { font-size: 48px; font-weight: 900; color: #f97; margin-bottom: 8px; }
      #dead-overlay p  { color: #888; font-size: 15px; margin-bottom: 6px; }
      #dead-overlay .final-score { font-size: 28px; color: #fff; font-weight: 700; margin-bottom: 24px; }
      #dead-overlay button {
        background: #7ef7a0; color: #111;
        font-size: 16px; font-weight: 700;
        border: none; padding: 12px 40px;
        border-radius: 8px; cursor: pointer; letter-spacing: 1px;
      }

      #hints {
        position: absolute; bottom: 18px; left: 24px;
        color: #555; font-size: 12px; line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="score">Masa: 0</div>
      <div id="leaderboard">
        <h3>Leaderboard</h3>
        <div id="lb-entries"></div>
      </div>
      <div id="ping-display">ping: --ms</div>
      <div id="minimap"><canvas id="mm"></canvas></div>
      <div id="hints">
        <b style="color:#777">W</b> — ispali masu&nbsp;&nbsp;
        <b style="color:#777">Space</b> — podeli
      </div>
    </div>

    <div id="overlay">
      <h1>agar.io</h1>
      <p>Pomeri miš da navigiraš. Pojedi manje ćelije da narasteš.</p>
      <input id="nick" type="text" placeholder="Unesi ime" maxlength="16" />
      <button id="play-btn">IGRAJ</button>
      <div class="status" id="conn-status">Nije povezan</div>
    </div>

    <div id="dead-overlay">
      <h2>Izgubio si!</h2>
      <p>Konačan rezultat</p>
      <div class="final-score" id="final-score">0</div>
      <button id="respawn-btn">Igraj Ponovo</button>
    </div>

    <script>
    // ─── CANVAS & RESIZE ────────────────────────────────────────────────────
    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');
    const mm     = document.getElementById('mm');
    const mmCtx  = mm.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      mm.width  = 130;
      mm.height = 130;
    }
    window.addEventListener('resize', resize);
    resize();

    // ─── STANJE KLIJENTA ────────────────────────────────────────────────────
    // Klijent je "glup" – samo prikazuje ono što server šalje.
    // Nema fizike, nema kolizija, nema spawning logike.

    let gameState = {
      cells: [],        // sve vidljive ćelije (igrači + botovi)
      food: [],         // vidljiva hrana
      viruses: [],      // vidljivi virusi
      myMass: 0,
      myPlayerId: null,
      myHue: 0,
      myName: 'Igrač',
      worldSize: 4000,
      leaderboard: []
    };

    // Za glatku interpolaciju između tikova
    let prevState = null;
    let lastTickTime = 0;
    let tickInterval = 1000 / 25;  // pretpostavljamo 25 TPS dok ne saznamo bolje

    // ─── WEBSOCKET ──────────────────────────────────────────────────────────
    let ws = null;
    let wsConnected = false;
    let playerName = 'Igrač';
    let animId = null;

    // Generišemo ili vraćamo session_id iz sessionStorage
    if (!sessionStorage.session_id) {
      sessionStorage.session_id = Math.random().toString(36).substr(2, 12);
    }
    const SESSION_ID = sessionStorage.session_id;

    // Ping merenje
    let pingStart = 0;
    let pingMs = 0;
    let pingInterval = null;

    function setStatus(msg, cls = '') {
      const el = document.getElementById('conn-status');
      el.textContent = msg;
      el.className = 'status ' + cls;
    }

    function connectWS() {
      setStatus('Povezujem se...', 'connecting');
      ws = new WebSocket('ws://localhost:8765');

      ws.onopen = () => {
        wsConnected = true;
        setStatus('Povezan – unesite ime i pritisnite IGRAJ', 'connected');
        ws.send(JSON.stringify({ type: 'hello', session_id: SESSION_ID }));
        // Ping svakih 3s
        pingInterval = setInterval(() => {
          if (ws && ws.readyState === 1) {
            pingStart = performance.now();
            ws.send(JSON.stringify({ type: 'ping' }));
          }
        }, 3000);
      };

      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          handleServerMessage(data);
        } catch (err) {
          console.warn('Neispravna poruka:', err);
        }
      };

      ws.onclose = () => {
        wsConnected = false;
        setStatus('Konekcija prekinuta. Osvežite stranicu.', 'error');
        clearInterval(pingInterval);
        // Pokušaj reconnect nakon 2s
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => {
        setStatus('Greška konekcije. Proverite da li server radi.', 'error');
      };
    }

    function sendInput(split = false, eject = false) {
      if (!ws || ws.readyState !== 1 || !gameState.myPlayerId) return;
      // Konvertujemo screen koordinate u world koordinate
      const cam = getCamera();
      const wx = (mouseX - canvas.width  / 2) / cam.zoom + cam.x;
      const wy = (mouseY - canvas.height / 2) / cam.zoom + cam.y;
      ws.send(JSON.stringify({
        type: 'input',
        tx: Math.round(wx * 10) / 10,
        ty: Math.round(wy * 10) / 10,
        split,
        eject
      }));
    }

    // Šaljemo input ~60x u sekundi (sinhronizovano sa render petljom)
    let inputThrottle = 0;

    function handleServerMessage(data) {
      switch (data.type) {

        case 'welcome':
          // Server nas prepoznao
          break;

        case 'init':
          gameState.myPlayerId = data.player_id;
          gameState.myHue      = data.hue;
          gameState.myName     = data.name;
          gameState.worldSize  = data.world_size || 4000;
          // Sakrij overlay, pokaži igru
          document.getElementById('overlay').style.display = 'none';
          document.getElementById('dead-overlay').style.display = 'none';
          if (!animId) loop();
          break;

        case 'tick':
          // Ovo je srce klijenta – server šalje šta treba prikazati
          prevState = {
            cells: gameState.cells,
            food:  gameState.food,
            viruses: gameState.viruses
          };
          gameState.cells   = data.cells   || [];
          gameState.food    = data.food    || [];
          gameState.viruses = data.viruses || [];
          gameState.myMass  = data.my_mass || 0;
          const now = performance.now();
          if (lastTickTime > 0) {
            tickInterval = now - lastTickTime;
          }
          lastTickTime = now;
          break;

        case 'leaderboard':
          gameState.leaderboard = data.entries || [];
          updateLeaderboard();
          break;

        case 'died':
          document.getElementById('final-score').textContent = data.final_mass || 0;
          document.getElementById('dead-overlay').style.display = 'flex';
          gameState.myPlayerId = null;
          gameState.cells = [];
          break;

        case 'pong':
          pingMs = Math.round(performance.now() - pingStart);
          document.getElementById('ping-display').textContent = `ping: ${pingMs}ms`;
          break;

        case 'error':
          console.error('Server greška:', data.msg);
          break;
      }
    }

    // ─── INPUT ──────────────────────────────────────────────────────────────
    let mouseX = 0, mouseY = 0;

    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.addEventListener('keydown', (e) => {
      if (!gameState.myPlayerId) return;
      if (e.code === 'Space') { e.preventDefault(); sendInput(true, false); }
      if (e.key  === 'w' || e.key === 'W') sendInput(false, true);
    });

    document.getElementById('play-btn').addEventListener('click', () => {
      if (!wsConnected) { setStatus('Čekam konekciju...', 'connecting'); return; }
      playerName = document.getElementById('nick').value.trim() || 'Igrač';
      ws.send(JSON.stringify({ type: 'join', name: playerName }));
    });

    document.getElementById('nick').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('play-btn').click();
    });

    document.getElementById('respawn-btn').addEventListener('click', () => {
      document.getElementById('dead-overlay').style.display = 'none';
      gameState.cells = [];
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'respawn', name: playerName }));
      }
    });

    // ─── KAMERA ─────────────────────────────────────────────────────────────
    function getCamera() {
      const myCells = gameState.cells.filter(c => c.mine);
      if (myCells.length === 0) {
        return { x: gameState.worldSize / 2, y: gameState.worldSize / 2, zoom: 1.0 };
      }
      const totalMass = myCells.reduce((s, c) => s + c.mass, 0) || 1;
      const cx = myCells.reduce((s, c) => s + c.x * c.mass, 0) / totalMass;
      const cy = myCells.reduce((s, c) => s + c.y * c.mass, 0) / totalMass;
      const zoom = Math.min(1.5, Math.max(0.15, 64 / Math.sqrt(totalMass)));
      return { x: cx, y: cy, zoom };
    }

    // ─── RENDER POMOĆNICI ───────────────────────────────────────────────────
    const massToR = (m) => Math.sqrt(m / Math.PI) * 4;
    const hslStr  = (h, s, l) => `hsl(${h},${s}%,${l}%)`;
    const clamp   = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const GRID_SIZE = 50;

    function worldToScreen(wx, wy, cam) {
      return [
        (wx - cam.x) * cam.zoom + canvas.width  / 2,
        (wy - cam.y) * cam.zoom + canvas.height / 2
      ];
    }

    function drawGrid(cam) {
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      const startX = Math.floor((cam.x - canvas.width  / 2 / cam.zoom) / GRID_SIZE) * GRID_SIZE;
      const startY = Math.floor((cam.y - canvas.height / 2 / cam.zoom) / GRID_SIZE) * GRID_SIZE;
      const endX   = cam.x + canvas.width  / 2 / cam.zoom;
      const endY   = cam.y + canvas.height / 2 / cam.zoom;
      ctx.beginPath();
      for (let x = startX; x < endX; x += GRID_SIZE) {
        const sx = (x - cam.x) * cam.zoom + canvas.width / 2;
        ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height);
      }
      for (let y = startY; y < endY; y += GRID_SIZE) {
        const sy = (y - cam.y) * cam.zoom + canvas.height / 2;
        ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy);
      }
      ctx.stroke();
    }

    function drawCell(c, cam, alpha = 1) {
      const r  = massToR(c.mass);
      const [sx, sy] = worldToScreen(c.x, c.y, cam);
      const sr = r * cam.zoom;
      if (sx + sr < 0 || sx - sr > canvas.width  ||
          sy + sr < 0 || sy - sr > canvas.height) return;

      ctx.globalAlpha = alpha;
      ctx.shadowColor = hslStr(c.hue, 80, 60);
      ctx.shadowBlur  = sr * 0.3;

      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(
        sx - sr * 0.3, sy - sr * 0.3, sr * 0.1,
        sx, sy, sr
      );
      g.addColorStop(0, hslStr(c.hue, 70, 75));
      g.addColorStop(1, hslStr(c.hue, 80, 45));
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = hslStr(c.hue, 60, 35);
      ctx.lineWidth = Math.max(1, sr * 0.06);
      ctx.stroke();

      if (sr > 16) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fontSize = clamp(sr * 0.45, 10, 36);
        ctx.font = `bold ${fontSize}px Segoe UI`;
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur  = 4;
        if (c.name) ctx.fillText(c.name, sx, sy - fontSize * 0.3);
        if (sr > 24) {
          ctx.font = `${clamp(sr * 0.3, 8, 22)}px Segoe UI`;
          ctx.fillText(Math.floor(c.mass), sx, sy + fontSize * 0.45);
        }
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
    }

    function drawVirus(v, cam) {
      const [sx, sy] = worldToScreen(v.x, v.y, cam);
      const sr = massToR(100) * cam.zoom;  // fiksni radius virusa
      if (sx + sr < 0 || sx - sr > canvas.width  ||
          sy + sr < 0 || sy - sr > canvas.height) return;

      ctx.save();
      ctx.translate(sx, sy);
      const spikes  = 12;
      const innerR  = sr * 0.75;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
        const rr    = i % 2 === 0 ? sr : innerR;
        if (i === 0) ctx.moveTo(Math.cos(angle) * rr, Math.sin(angle) * rr);
        else         ctx.lineTo(Math.cos(angle) * rr, Math.sin(angle) * rr);
      }
      ctx.closePath();
      ctx.fillStyle   = 'rgba(60,180,60,0.5)';
      ctx.strokeStyle = '#5f5';
      ctx.lineWidth   = 2;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawFood(f, cam) {
      const [sx, sy] = worldToScreen(f.x, f.y, cam);
      const sr = Math.max(4, massToR(f.mass) * 1.5 * cam.zoom);
      if (sx + sr < 0 || sx - sr > canvas.width  ||
          sy + sr < 0 || sy - sr > canvas.height) return;

      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fillStyle = hslStr(f.hue, 80, 60);
      ctx.fill();
    }

    function drawBorder(cam) {
      const W = gameState.worldSize;
      const corners = [[0,0],[W,0],[W,W],[0,W]];
      ctx.strokeStyle = 'rgba(255,80,80,0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const [sx, sy] = worldToScreen(corners[i][0], corners[i][1], cam);
        if (i === 0) ctx.moveTo(sx, sy);
        else         ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function drawMinimap() {
      const W = gameState.worldSize;
      const s = 130 / W;
      mmCtx.clearRect(0, 0, 130, 130);
      mmCtx.fillStyle = '#0a0a14';
      mmCtx.fillRect(0, 0, 130, 130);

      for (const f of gameState.food) {
        mmCtx.fillStyle = hslStr(f.hue, 70, 55);
        mmCtx.fillRect(f.x * s - 0.5, f.y * s - 0.5, 1, 1);
      }

      for (const c of gameState.cells) {
        if (c.mine) continue;
        mmCtx.beginPath();
        mmCtx.arc(c.x * s, c.y * s, Math.max(1.5, massToR(c.mass) * s), 0, Math.PI * 2);
        mmCtx.fillStyle = hslStr(c.hue, 70, 55);
        mmCtx.fill();
      }

      for (const c of gameState.cells.filter(c => c.mine)) {
        mmCtx.beginPath();
        mmCtx.arc(c.x * s, c.y * s, Math.max(2, massToR(c.mass) * s), 0, Math.PI * 2);
        mmCtx.fillStyle = hslStr(gameState.myHue, 90, 70);
        mmCtx.fill();
      }

      // Viewport pravougaonik
      const cam = getCamera();
      const vw  = (canvas.width  / cam.zoom) * s;
      const vh  = (canvas.height / cam.zoom) * s;
      const vx  = (cam.x - canvas.width  / 2 / cam.zoom) * s;
      const vy  = (cam.y - canvas.height / 2 / cam.zoom) * s;
      mmCtx.strokeStyle = 'rgba(255,255,255,0.4)';
      mmCtx.lineWidth = 1;
      mmCtx.strokeRect(vx, vy, vw, vh);
    }

    // ─── UI UPDATE ──────────────────────────────────────────────────────────
    function updateLeaderboard() {
      const lbEl = document.getElementById('lb-entries');
      lbEl.innerHTML = gameState.leaderboard.map((e, i) => {
        const isMe = e.player_id === gameState.myPlayerId;
        return `<div class="entry ${isMe ? 'me' : ''}">
          ${i + 1}. ${e.name} — ${e.mass}
        </div>`;
      }).join('');
    }

    // ─── RENDER PETLJA ──────────────────────────────────────────────────────
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111318';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cam = getCamera();
      drawGrid(cam);
      drawBorder(cam);

      // Hrana
      for (const f of gameState.food)    drawFood(f, cam);
      // Virusi
      for (const v of gameState.viruses) drawVirus(v, cam);

      // Sortiraj ćelije: tuđe prvo, naše na vrhu (da budu ispred)
      const others = gameState.cells.filter(c => !c.mine);
      const mine   = gameState.cells.filter(c =>  c.mine);

      for (const c of others) drawCell(c, cam, 1.0);
      for (const c of mine)   drawCell(c, cam, 0.95);

      // HUD
      document.getElementById('score').textContent =
        `Masa: ${Math.floor(gameState.myMass)}`;

      drawMinimap();
    }

    function loop() {
      animId = requestAnimationFrame(loop);

      // Šaljemo input svaki frame (throttlovan na ~60/s, dovoljno za server)
      sendInput(false, false);

      render();
    }

    // ─── START ──────────────────────────────────────────────────────────────
    connectWS();

    // Prikazi overlay odmah
    document.getElementById('overlay').style.display = 'flex';
    </script>
  </body>
</html>
